# Standalone R2 profile, intentionally NOT including application.conf/projection.conf.
# No reference to legacy serializers, sharding bootstrap, H2, Mongo, or projection services.
play.http.router = "durablefab.Routes"
# Required per-demo secret; deliberately no checked-in working secret.
play.http.secret.key = ${FAB_DURABLE_PLAY_SECRET}
play.server.http.address = "127.0.0.1"
play.server.http.port = 9012
play.filters.hosts.allowed = ["localhost", "127.0.0.1", "[::1]"]
play.filters.csrf.header.protectHeaders = null

# Explicitly suppress the existing eager bootstrap even if enabled by a fallback config.
# This is a disabled module NAME, not a compile/runtime dependency on that untracked module.
play.modules.disabled += "net.imadz.infrastructure.bootstrap.FabRuntimeModule"
play.modules.disabled += "play.api.db.DBModule"
play.modules.disabled += "play.api.db.evolutions.EvolutionsModule"

fab.durable {
  namespace = "fab-durable-r2-v1"
  fixture-port = 19112
  fixture-controls = false
  # An absolute, exclusively owned directory, kept unchanged for a restart.
  storage-root = ${FAB_DURABLE_STORAGE_ROOT}
}

akka {
  actor.provider = local
  persistence {
    journal.plugin = "akka.persistence.journal.leveldb"
    journal.leveldb {
      native = off
      dir = ${fab.durable.storage-root}"/journal"
    }
    snapshot-store.plugin = "akka.persistence.snapshot-store.local"
    snapshot-store.local.dir = ${fab.durable.storage-root}"/snapshots"
  }
}

# Human-operated demo: bounded observation rounds, never automatic business resubmission.
monarch.operation.max-checks = 120
monarch.operation.manual-check-budget = 30
monarch.delivery.max-polls = 300

# The library artifact's reference.conf supplies Monarch/batch/delivery/resource serializers.
# FabLedgerClient owns four blocking-I/O workers, a sixteen-call queue and socket deadlines;
# the Play lifecycle closes it. No unbounded dispatcher queue or application bootstrap is used.
