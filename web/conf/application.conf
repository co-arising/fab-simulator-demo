# fab-simulator-web — Play 配置
# 默认使用本地 LevelDB + 文件型 H2；Mongo profile 必须显式选择。

include "projection.conf"

fab.persistence {
  write-journal-plugin-id = "akka.persistence.journal.leveldb"
  read-journal-plugin-id = "akka.persistence.query.journal.leveldb"
}

play.http.secret.key = "changeme-for-demo-only"
play.modules.enabled += "net.imadz.infrastructure.bootstrap.FabRuntimeModule"

play.modules.disabled += "play.api.db.DBModule"
play.modules.disabled += "play.api.db.evolutions.EvolutionsModule"

akka {
  loglevel = INFO

  actor {
    provider = cluster
    serializers {
      fab-pipeline-proto = "net.imadz.infrastructure.persistence.FabPipelineSerializer"
      lot-journal-proto = "net.imadz.infrastructure.persistence.LotJournalSerializer"
    }
    serialization-bindings {
      "net.imadz.application.chain.FabPipelineExecutionActor$Event" = fab-pipeline-proto
      "net.imadz.application.chain.FabPipelineExecutionActor$State" = fab-pipeline-proto
      "net.imadz.infrastructure.proto.lot.LotEventPO$Event" = lot-journal-proto
    }
  }

  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.port = 2551
  }

  cluster {
    seed-nodes = ["akka://application@127.0.0.1:2551"]
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
  }

  persistence {
    journal.plugin = ${fab.persistence.write-journal-plugin-id}
    journal.leveldb.dir = "target/journal"
    journal.leveldb.native = off
    snapshot-store.plugin = "akka.persistence.snapshot-store.local"
    snapshot-store.local.dir = "target/snapshots"
  }

  # Read the same active journal; handlers decode typed PO payloads themselves.
  persistence.query.journal.leveldb {
    write-plugin = ${fab.persistence.write-journal-plugin-id}
    refresh-interval = 1 second
    max-buffer-size = 100
  }

  # Only the explicit application-mongo.conf profile activates Mongo persistence.
  contrib.persistence.mongodb.mongo.mongouri = "mongodb://127.0.0.1:27017/fab-simulator?maxPoolSize=20"
}

play.server.websocket.periodic-keep-alive-max-idle = 10 seconds
