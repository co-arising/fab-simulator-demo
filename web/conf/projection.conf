# Standalone demo read-side storage. Override the URL for isolated runs.
jdbc-connection-settings {
  driver = "org.h2.Driver"
  url = "jdbc:h2:file:./target/fab-read-model;DB_CLOSE_ON_EXIT=FALSE"
  user = "sa"
  password = ""
  connection-pool {
    max-pool-size = 8
    timeout = 10 seconds
  }
}
akka.projection.jdbc {
  dialect = "h2-dialect"
  blocking-jdbc-dispatcher.thread-pool-executor.fixed-pool-size = 8
}
